ign-items:center;justify-content:center;gap:9px}.stage-map>button:hover{border-color:var(--cyan);background:#243e50}.stage-map strong{color:var(--yellow);font-size:26px}.stage-map small{font-size:10px;line-height:1.3}.loop-board{display:grid;grid-template-columns:1fr 1fr;gap:16px}.loop-cell{background:#202443;border:2px solid #6557a0;min-height:118px;padding:19px;display:flex;gap:16px;align-items:center;transition:.2s}.loop-cell.active{background:#184650;border-color:var(--cyan);box-shadow:0 0 25px #27d9e82e}.loop-cell em{font-style:normal;font-size:31px}.loop-cell h3{font:900 17px monospace;margin:0 0 5px;color:var(--yellow)}.loop-cell p{font-size:12px;color:#b9b9d5;margin:0}.loop-controls{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}.nested{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}.nested span{border:2px solid #66578c;background:#211d3a;padding:15px;color:var(--white);font:800 13px monospace}.nest-arrow{color:var(--cyan);font-size:25px}.time-row{display:grid;grid-template-columns:160px 1fr 100px;align-items:center;gap:20px;margin:20px 0}.time-row label{font:bold 16px monospace;color:var(--white)}.time-row .track{height:24px;background:#232443;border:2px solid #645889}.time-row .track i{display:block;height:100%;width:var(--w);background:var(--c);animation:grow .8s steps(15,end) both}.time-row b{font:800 13px monospace;color:var(--yellow)}.calc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;text-align:center}.calc-cell{padding:22px 8px;background:#26213e;border:2px solid #69608b}.calc-cell strong{display:block;color:var(--yellow);font:950 clamp(38px,6vw,80px) monospace}.calc-cell small{font:700 12px monospace;color:#bbb4dc}.calc-sign{font-size:40px;color:var(--cyan);align-self:center}.chart{width:100%;height:auto;max-height:330px;display:block;background:#141a35;border:3px solid #64598b}.chart .gridline{stroke:#363456;stroke-dasharray:4 7}.chart text{fill:#bdb8da;font:12px monospace}.selector{display:flex;gap:10px;flex-wrap:wrap}.selector button{background:#272448;border:2px solid #635591;color:#c7c2e1;padding:12px;font:bold 13px monospace}.selector button.active,.selector button:hover{color:var(--yellow);border-color:var(--yellow)}.ant-canvas{display:block;width:100%;height:auto;background:#171c39;border:3px solid #64598b;image-rendering:pixelated;aspect-ratio:720/390}.ant-info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:800 12px monospace;color:var(--green);margin:8px 0 12px}.flow-range{width:100%;accent-color:var(--cyan);margin:15px 0}.tiny-label{color:var(--muted);font:700 12px monospace}.quest{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.quest button{padding:17px 12px;min-height:150px;border:2px solid #655790;background:#231e40;color:#e5dffc;text-align:left}.quest button.done{border-color:var(--green);background:#1b423f}.quest strong{display:block;font:900 20px monospace;color:var(--yellow);margin-bottom:12px}.quest span{font:800 13px monospace;line-height:1.5}.message{font-size:clamp(20px,2.5vw,34px);font-weight:700;line-height:1.5}.boss{font:950 clamp(50px,8vw,112px) monospace;color:var(--yellow);text-shadow:6px 6px #70425e}.large-center{text-align:center;max-width:1100px;margin:auto}.footnote{font-size:13px;line-height:1.5;color:var(--muted);margin-top:20px}.stat{border:2px solid #615588;background:#1c1e39;padding:19px;margin:10px 0}.stat strong{display:block;font:900 17px monospace;color:var(--cyan);margin-bottom:9px}.slide-scene{position:relative;min-height:240px;display:grid;place-items:center;background:linear-gradient(transparent 79%,#292546 80%),repeating-linear-gradient(90deg,#232642 0 24px,#262441 24px 48px);border:3px solid #615588;overflow:hidden}.sprite-row{display:flex;justify-content:center;gap:35px;font-size:clamp(46px,7vw,90px);align-items:center}.pixel-coin{color:var(--yellow);font-size:42px;text-shadow:4px 4px #79552d}.float{animation:float 2.4s steps(10,end) infinite}.sparkle{animation:blink .75s steps(2,end) infinite}.tag{font:700 11px monospace;color:var(--yellow);border:1px solid #7f6c82;background:#2b2449;padding:7px 9px}.storyboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.storyboard .pixel-panel{min-height:155px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.storyboard .emoji{font-size:48px}.storyboard strong{font:900 13px monospace;color:var(--yellow)}@keyframes arrive{from{opacity:0;transform:translateY(15px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes blink{50%{opacity:.25}}@keyframes grow{from{width:0}to{width:var(--w)}}@keyframes float{50%{transform:translateY(-9px)}}.reduced *{animation:none!important;transition:none!important}.reduced .press-text{opacity:1}@media(max-width:1000px){.footer{grid-template-columns:1fr 1.5fr}.keyhelp{display:none}.stage-map{grid-template-columns:repeat(4,1fr)}.quest{grid-template-columns:repeat(3,1fr)}.layout-split{gap:20px}}@media(max-width:720px){.topbar{min-height:64px;flex-wrap:wrap;gap:8px}.chapter{display:none}.top-actions{gap:5px}.tiny{font-size:10px;padding:7px}.stage{padding:30px 20px}.layout-split,.tiles,.tiles.two,.calc-grid{grid-template-columns:1fr}.loop-board{grid-template-columns:1fr}.stage-map{grid-template-columns:repeat(2,1fr)}.quest{grid-template-columns:repeat(2,1fr)}.footer{grid-template-columns:1fr;gap:12px}.controls{justify-content:space-between}.time-row{grid-template-columns:100px 1fr 60px;gap:9px}.time-row label{font-size:12px}.storyboard{grid-template-columns:repeat(2,1fr)}.sprite-row{gap:10px}.headline{font-size:clamp(30px,9vw,48px)}}@media(min-width:1100px) and (min-height:780px){.stage{min-height:calc(100svh - 167px)}}

<div id="app" class="app"><div class="ambient stars" aria-hidden="true"></div><header class="topbar"><a href="#slide-1" class="brand">◈ <span>PIXEL<span class="cyan">QUEST</span></span></a><span class="chapter" id="chapter">INTRO / PRESS START</span><div class="top-actions"><button class="tiny" id="motionBtn" title="Reduzir animações">◉ FX ON</button><button class="tiny" id="notesBtn" title="Notas do apresentador (N)">▤ NOTAS</button><button class="tiny" id="fullBtn" title="Tela cheia (F)">⛶ TELA CHEIA</button></div></header><main class="stage" id="stage" aria-live="polite"></main><aside class="speaker-notes" id="notes" hidden><strong>NOTAS DO APRESENTADOR</strong><p id="notesText"></p></aside><footer class="footer"><div class="controls"><button class="nav" id="prev" aria-label="Slide anterior">◀ <span>VOLTAR</span></button><button class="nav" id="next" aria-label="Próximo slide"><span>AVANÇAR</span> ▶</button></div><div class="progress-wrap"><div class="progress-label"><span id="phaseLabel">FASE 00</span><span id="count">01 / 15</span></div><div class="progress"><div id="bar"></div></div></div><div class="keyhelp">← → NAVEGAR <span>·</span> F TELA CHEIA <span>·</span> N NOTAS</div></footer></div><script>
'use strict';
const S=document.getElementById('stage'),$=id=>document.getElementById(id);let idx=0,cleanup=[],reduced=false,notesVisible=false;
const item=(icon,title,body)=>`<div class="pixel-panel"><div class="icon-square">${icon}</div><h3 class="card-title">${title}</h3><p class="card-text">${body}</p></div>`;
const head=(stage,title,sub)=>`<p class="kicker">${stage}</p><h1 class="headline sm">${title}</h1><p class="subtitle">${sub}</p>`;
const wrap=s=>`<article class="slide">${s}</article>`;
const pages=[
{phase:'INTRO / PRESS START',notes:'Apresente a pergunta de abertura: o que realmente faz um jogador repetir ações e progredir? Diferencie diversão momentânea de estrutura de incentivos.',render:()=>wrap(`<div class="layout-split"><div><p class="kicker">★ UMA JORNADA PELO GAME DESIGN ★</p><h1 class="headline">CORE LOOP<br>NO GAME<br>DESIGN</h1><p class="subtitle">Como ciclos de jogabilidade estruturam experiência, progressão e engajamento.</p><button class="pixel-btn" data-next>▶ PRESS START</button><p class="footnote">15 fases · apresentação interativa · edição Super Pixel 8-bit</p></div><div class="pixel-panel" style="text-align:center"><div class="sprite-row"><span class="float">🕹️</span><span class="sparkle pixel-coin">✦</span><span class="float">👾</span></div><div class="slide-scene" style="margin-top:25px"><div><div class="sprite">⚔️</div><p class="press-text">INSERT COIN · PLAYER 01</p></div></div></div></div>`)},
{phase:'WORLD MAP / ROTAS',notes:'Apresente as sete fases conceituais, e explique que elas constroem uma metodologia para avaliar loops.',render:()=>wrap(`${head('MAPA DA JORNADA','SELEÇÃO DE FASES','Sete territórios para compreender, analisar e projetar ciclos de jogabilidade.') }<div class="stage-map">${[['📖','CONCEITO',2],['🔁','ESTRUTURA',4],['⚙️','SUB-LOOPS',6],['⌛','DURAÇÃO',8],['💠','FLOW',10],['🚀','DIFERENCIAL',11],['🏆','APLICAÇÃO',14]].map(([icon,name,go],n)=>`<button data-go="${go-1}"><strong>${icon}</strong><span>FASE 0${n+1}</span><small>${name}</small></button>`).join('')}</div><p class="footnote">Clique em uma fase para navegar diretamente até ela.</p>`)},
{phase:'LEVEL 01 / CONCEITO',notes:'Core Loop é uma abstração das ações recorrentes e sua ligação com progressão. Não confunda com o loop técnico de atualização/renderização. Definição sintetizada da transcrição fornecida.',render:()=>wrap(`${head('LEVEL 01 · KNOWLEDGE UNLOCKED','O QUE É CORE LOOP?','O conjunto de ações que o jogador repete para progredir e se aproximar dos objetivos do jogo.') }<div class="tiles two" style="margin-top:30px">${item('🎮','CORE LOOP · DESIGN','Ações → Recompensas → Novas possibilidades. Organiza a experiência do jogador.')}${item('⚙️','GAME LOOP · TÉCNICO','Entrada → Atualização → Renderização. Organiza o processamento do software.')}</div><div class="notice" style="margin-top:25px"><strong class="highlight">IDEIA-CHAVE:</strong> repetir uma ação é diferente de repetir um ciclo que transforma o jogo.</div>`)},
{phase:'LEVEL 01 / ESTRUTURA',notes:'O ciclo é um modelo recorrente de aventura, não universal. Exploração dá acesso a desafios; objetivos geram recompensas; melhorias abrem novas opções.',render:()=>wrap(`${head('LEVEL 01 · ENGINE ACTIVE','O MOTOR DO JOGO','Um ciclo completo conecta ações, recompensas e novas possibilidades.') }<div class="layout-split"><div class="loop-board" id="loopBoard">${[['🧭','EXPLORAR','Conhecer o mundo'],['⚔️','DESAFIAR','Superar obstáculos'],['🎯','CONCLUIR','Cumprir objetivos'],['⬆️','MELHORAR','Desbloquear opções']].map(([i,t,d],k)=>`<div class="loop-cell ${k===0?'active':''}"><em>${i}</em><div><h3>0${k+1} ${t}</h3><p>${d}</p></div></div>`).join('')}</div><div class="pixel-panel"><h3 class="card-title">↻ CICLO ATIVO</h3><div class="sprite" id="loopSprite" style="text-align:center">🧭</div><div class="metric"><span>ETAPA</span><span id="loopCounter">01 / 04</span></div><div class="meter"><div id="loopMeter" style="width:25%"></div></div><p class="card-text" style="margin-top:20px">O upgrade precisa transformar o próximo ciclo, e não apenas encerrar o atual.</p><div class="loop-controls"><button class="pixel-btn secondary" id="pauseLoop">Ⅱ PAUSAR</button><button class="pixel-btn" id="stepLoop">⏭ PRÓXIMO</button></div></div></div>`)},
{phase:'LEVEL 02 / INVENTÁRIO',notes:'O ciclo ajuda a priorizar funcionalidades, medir progressão, orientar protótipos, diferenciar projetos e criar comunicação comercial fiel à jogabilidade.',render:()=>wrap(`${head('LEVEL 02 · INVENTORY UNLOCKED','POR QUE O LOOP IMPORTA?','Cinco ferramentas que ficam disponíveis quando o Core Loop é conhecido.') }<div class="tiles" style="margin-top:28px">${item('🧩','EXPERIÊNCIA','Organiza o que o jogador faz durante a sessão.')}${item('📈','PROGRESSÃO','Define mudanças e oportunidades entre ciclos.')}${item('🛠️','DECISÕES','Prioriza desenvolvimento e escopo.')}${item('💎','DIFERENCIAL','Identifica a mecânica de maior valor.')}${item('📣','COMUNICAÇÃO','Explica o jogo no trailer e na loja.')}</div>`)},
{phase:'LEVEL 03 / SISTEMAS',notes:'Sub-loops transformam atividades genéricas em interações concretas. Macro-loop pode sustentar objetivos distantes; micro-loop define ações pontuais. Escalas não são regras fixas.',render:()=>wrap(`${head('LEVEL 03 · SYSTEM MAP','LOOPS DENTRO DE LOOPS','As grandes decisões são sustentadas por pequenos ciclos recorrentes.') }<div class="pixel-panel" style="margin-top:25px"><div class="hrow"><span class="pill">MACRO-LOOP</span><strong class="highlight">Explorar uma região e expandir a colônia</strong></div><div class="nested"><span>DESCOBRIR</span><b class="nest-arrow">→</b><span>COLETAR</span><b class="nest-arrow">→</b><span>EXPANDIR</span><b class="nest-arrow">→</b><span>MELHORAR</span><b class="nest-arrow">↻</b></div><div class="notice" style="margin-top:28px"><strong>MICRO-LOOP · COLETA:</strong> encontrar alimento → recrutar operária → transportar → armazenar → voltar.</div></div><p class="footnote">As escalas são modelos de análise, não categorias obrigatórias de todo jogo.</p>`)},
{phase:'LEVEL 03 / LIVE SIMULATION',notes:'Demonstração conceitual desenvolvida para esta apresentação, não extraída da fala original. Formigas são agentes individuais que caminham entre fonte de alimento e estoque. Botões alteram capacidade de transporte.',render:()=>wrap(`${head('LEVEL 03 · PLAYABLE EXAMPLE','COLÔNIA INCREMENTAL','Formigas independentes caminham, coletam e transportam recursos fisicamente.') }<div class="layout-split" style="grid-template-columns:1.45fr .7fr;align-items:stretch"><div><canvas id="antCanvas" class="ant-canvas" width="720" height="390" aria-label="Simulação animada de colônia de formigas"></canvas><div class="ant-info"><span id="antPopulation">OPERÁRIAS: 3</span><span id="antStock">ESTOQUE: 0</span><span id="antCargo">CARGA: 1</span></div></div><div class="pixel-panel"><h3 class="card-title">COLÔNIA 01</h3><p class="card-text">Um alimento deve chegar ao ninho para aumentar o estoque.</p><div class="metric"><span>ALIMENTO</span><strong class="green" id="antFood">000</strong></div><div class="meter"><div id="antBar" style="width:0"></div></div><div class="loop-controls"><button class="pixel-btn secondary" id="addAnt">+ OPERÁRIA</button><button class="pixel-btn" id="upgradeAnt">⬆ CARGA</button><button class="pixel-btn secondary" id="resetAnt">↻ RESET</button></div><p class="footnote">A simulação simplifica custos e logística para ilustrar o Core Loop.</p></div></div>`)},
{phase:'LEVEL 04 / TEMPO',notes:'As durações são apenas exemplos didáticos. Loops curtos funcionam em jogos incrementais se a repetição cria mudanças perceptíveis; não prescrever um tempo ideal universal.',render:()=>wrap(`${head('LEVEL 04 · TIME SCALE','QUANTO DURA UM LOOP?','Diferentes escalas convivem na mesma experiência de jogo.') }<div class="pixel-panel" style="margin-top:26px">${[['MICRO-LOOP','segundos','24%','#27d9e8'],['CORE LOOP','minutos','44%','#9b76f5'],['MACRO-LOOP','dezenas de min','72%','#ffcc54'],['META','horas','100%','#62e5a0']].map(([n,t,w,c])=>`<div class="time-row"><label>${n}</label><div class="track"><i style="--w:${w};--c:${c}"></i></div><b>${t}</b></div>`).join('')}</div><div class="notice" style="margin-top:25px">A pergunta decisiva não é apenas <em>quanto tempo</em> dura o ciclo, mas <strong>o que se transforma</strong> ao terminá-lo.</div>`)},
{phase:'LEVEL 04 / WARNING',notes:'No vídeo, o autor planeja 6 a 8 horas e identifica um ciclo de cerca de 3 minutos para 18 missões. A multiplicação 54 minutos é um alerta preliminar, não um teste confiável da duração final.',render:()=>wrap(`${head('LEVEL 04 · DIAGNOSTIC','UM PROBLEMA DE PROGRESSÃO','Estudo apresentado na transcrição: ritmo das missões versus duração pretendida.') }<div class="pixel-panel" style="border-color:var(--red);margin-top:22px"><div class="hrow"><span class="pill" style="color:var(--red);border-color:var(--red)">⚠ WARNING</span><span class="muted">ESTIMATIVA DO AUTOR</span></div><div class="calc-grid" style="margin:24px 0"><div class="calc-cell"><strong>3</strong><small>MIN / MISSÃO</small></div><div class="calc-cell"><strong>18</strong><small>MISSÕES</small></div><div class="calc-cell"><strong id="computed">0</strong><small>MINUTOS ESTIMADOS</small></div></div><p class="message">Meta de <strong class="highlight">6–8 horas</strong> → enriquecer exploração, agência e decisões intermediárias.</p></div><p class="footnote">54 minutos é uma aproximação linear; exploração livre e atividades opcionais podem alterar a duração real.</p>`)},
{phase:'LEVEL 05 / FLOW',notes:'O slide reúne dois conceitos relacionados mas distintos: Flow como relação desafio/habilidade e tensão-alívio como estrutura de ritmo. Ambos são modelos qualitativos a validar com jogadores.',render:()=>wrap(`${head('LEVEL 05 · BALANCE SYSTEM','FLOW, TENSÃO E ALÍVIO','Desafio e habilidade precisam evoluir em conjunto; o ritmo alterna pressão e descanso.') }<div class="layout-split" style="grid-template-columns:1fr 1fr"><div class="pixel-panel"><h3 class="card-title">CURVA DE TENSÃO</h3><svg class="chart" viewBox="0 0 520 290" role="img" aria-label="Linha crescente com picos e alívios"><g>${Array.from({length:5},(_,i)=>`<line class="gridline" x1="35" y1="${40+i*50}" x2="495" y2="${40+i*50}"/>`).join('')}</g><polyline id="tensionLine" fill="none" stroke="#27d9e8" stroke-width="5" stroke-linejoin="bevel" points="35,230 92,157 136,226 191,125 232,227 287,88 340,225 391,48 443,220 490,108"/><text x="35" y="280">PROGRESSÃO →</text></svg><p class="footnote">Representação conceitual de tensão e alívio, não medição de jogadores.</p></div><div class="pixel-panel"><h3 class="card-title">EQUILÍBRIO DE FLOW</h3><p class="tiny-label">HABILIDADE DO JOGADOR</p><input class="flow-range" id="skill" type="range" min="0" max="100" value="55"><p class="tiny-label">DESAFIO DO JOGO</p><input class="flow-range" id="challenge" type="range" min="0" max="100" value="57"><div class="stat" style="margin-top:25px"><strong id="flowState">◈ FLOW</strong><p class="card-text" id="flowDesc">Desafio compatível com habilidade.</p></div><button class="pixel-btn secondary" id="flowReset">↻ EQUILIBRAR</button></div></div>`)},
{phase:'LEVEL 06 / USP',notes:'Classificações de ênfase são estratégias analíticas, não uma taxonomia universal de gêneros. Exemplos da transcrição: Coromon ênfase em exploração/puzzles, Temtem em criaturas, Cassette Beasts em combinações.',render:()=>wrap(`${head('LEVEL 06 · SKILL TREE','QUAL É O SEU DIFERENCIAL?','Um ciclo conhecido pode ganhar identidade ao enfatizar uma mecânica.') }<div class="layout-split"><div><div class="selector" id="focusOptions">${[['EXPLORAÇÃO','🧭'],['COMBATE','⚔️'],['EVOLUÇÃO','⬆️'],['ESTRATÉGIA','♟️']].map(([a,b],i)=>`<button data-focus="${i}" class="${i===0?'active':''}">${b} ${a}</button>`).join('')}</div><div class="pixel-panel" style="margin-top:25px"><h3 class="card-title" id="focusTitle">EXPLORAÇÃO</h3><p class="message" id="focusDetail">Descobrir áreas, rotas e desafios constitui a principal promessa de experiência.</p></div></div><div class="slide-scene"><div style="text-align:center"><div class="sprite float" id="focusIcon">🧭</div><p class="press-text">UNIQUE SELLING POINT</p></div></div></div>`)},
{phase:'LEVEL 06 / MARKETING',notes:'O autor usa BPM: Bullets Per Minute para ilustrar como um trailer apresenta atirar, recarregar e desviar no ritmo. O slide reinterpreta o conceito em quatro quadros de comunicação.',render:()=>wrap(`${head('LEVEL 06 · LAUNCH READY','DO LOOP AO MARKETING','Um bom trailer torna visíveis as ações principais e o diferencial do jogo.') }<div class="storyboard" style="margin-top:28px">${[['🎬','01 · MOSTRAR','Gameplay real'],['🎯','02 · AÇÃO','O que o jogador faz'],['💎','03 · DIFERENCIAL','O que muda a experiência'],['🏆','04 · RESULTADO','Que recompensa recebe']].map(([i,t,d])=>`<div class="pixel-panel"><div class="emoji">${i}</div><strong>${t}</strong><small class="muted">${d}</small></div>`).join('')}</div><div class="notice" style="margin-top:30px"><strong class="highlight">EXEMPLO: BPM · BULLETS PER MINUTE</strong><br>Atirar, recarregar, pular e desviar seguindo a batida da música.</div>`)},
{phase:'BOSS FIGHT / CRITICAL THINKING',notes:'Análise crítica desta apresentação (não são afirmações do autor): a divisão tripla de gêneros não é universal; design e experimentação não são opostos absolutos; Flow precisa de observação e testes.',render:()=>wrap(`${head('BOSS FIGHT · CRITICAL THINKING','ANÁLISE CRÍTICA','Avaliar uma teoria também faz parte do trabalho de Game Design.') }<div class="tiles two" style="margin-top:27px"><div class="pixel-panel" style="border-color:var(--green)"><h3 class="card-title green">+ PONTOS FORTES</h3><p class="card-text">✓ Core Loop como ferramenta de projeto<br><br>✓ Mecânicas conectadas à progressão<br><br>✓ Alinhamento entre produto e marketing</p></div><div class="pixel-panel" style="border-color:var(--red)"><h3 class="card-title" style="color:var(--red)">! RESSALVAS</h3><p class="card-text">△ Três gêneros primários não são consenso<br><br>△ Design também envolve experimentação<br><br>△ Flow não é garantido só pela dificuldade</p></div></div><div class="notice" style="margin-top:25px">A próxima etapa é <strong>prototipar, observar jogadores e refinar hipóteses</strong>.</div>`)},
{phase:'FINAL QUEST / CHECKLIST',notes:'Questão 1 identifica ação recorrente; 2 a recompensa; 3 a transformação; 4 o novo objetivo; 5 a USP. Incentive os alunos a exemplificar cada resposta num protótipo.',render:()=>wrap(`${head('FINAL QUEST · MISSION BOARD','PROJETE SEU CORE LOOP','Marque as cinco perguntas conforme consegue respondê-las para seu jogo.') }<div class="quest" style="margin-top:27px" id="questBoard">${[['AÇÃO','O que o jogador faz repetidamente?'],['RECOMPENSA','O que recebe após a ação?'],['MUDANÇA','O que se transforma no sistema?'],['OBJETIVO','Qual novo desafio aparece?'],['DIFERENCIAL','Por que este ciclo é único?']].map(([t,d],i)=>`<button data-quest="${i}" aria-pressed="false"><strong>□ 0${i+1}</strong><span>${t}</span><p class="card-text" style="font-size:12px;margin-top:9px">${d}</p></button>`).join('')}</div><div class="pixel-panel" style="margin-top:25px"><div class="metric"><strong>QUEST PROGRESS</strong><strong id="questCount">0 / 5</strong></div><div class="meter"><div id="questBar" style="width:0"></div></div><p class="press-text" style="margin-bottom:0" id="questState">COMPLETE OS OBJETIVOS PARA SUBIR DE NÍVEL</p></div>`)},
{phase:'MISSION CLEAR / ENDING',notes:'Feche enfatizando o valor de validar um ciclo completo antes de investir em grande volume de conteúdo e recursos visuais. O material original enfatiza o loop como ferramenta de design e marketing; esta apresentação amplia com postura crítica.',render:()=>wrap(`<div class="large-center"><p class="kicker">★ FINAL STAGE CLEARED ★</p><h1 class="boss">MISSION<br>CLEAR!</h1><div class="sprite-row" style="margin:30px 0"><span class="float">🏆</span><span class="sparkle pixel-coin">✦</span><span class="float">🕹️</span></div><h2 style="font-size:clamp(21px,3vw,39px);margin:0 0 15px">GAME DESIGN É <span class="accent">EXPERIÊNCIA</span></h2><p class="subtitle" style="margin:0 auto 27px">Não basta adicionar funcionalidades: as ações devem se conectar, gerar decisões e criar progressão significativa.</p><button class="pixel-btn" data-go="0">↻ RESTART PRESENTATION</button><p class="footnote">Fonte conceitual: transcrição sobre Core Loop fornecida pelo usuário · Exemplo das formigas e análise crítica adaptados para esta apresentação.</p></div>`)}
];
function register(f){cleanup.push(f)}
function setSlide(n){n=Math.max(0,Math.min(14,n));cleanup.forEach(f=>{try{f()}catch(e){}});cleanup=[];idx=n;S.innerHTML=pages[n].render();$('chapter').textContent=pages[n].phase;$('phaseLabel').textContent=pages[n].phase.split('/')[0].trim();$('count').textContent=`${String(n+1).padStart(2,'0')} / 15`;$('bar').style.width=`${(n+1)/15*100}%`;$('prev').disabled=n===0;$('next').disabled=n===14;$('notesText').textContent=pages[n].notes;document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>setSlide(idx+1));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setSlide(Number(b.dataset.go)));if(n===3)setupLoop();if(n===6)setupAnts();if(n===8)setupCalc();if(n===9)setupFlow();if(n===10)setupFocus();if(n===13)setupQuest();history.replaceState(null,'',`#slide-${n+1}`)}
function setupLoop(){let pos=0,paused=false;const els=[...document.querySelectorAll('.loop-cell')],icons=['🧭','⚔️','🎯','⬆️'];function update(){els.forEach((e,i)=>e.classList.toggle('active',i===pos));$('loopSprite').textContent=icons[pos];$('loopCounter').textContent=`0${pos+1} / 04`;$('loopMeter').style.width=(25*(pos+1))+'%'}const timer=setInterval(()=>{if(!paused){pos=(pos+1)%4;update()}},1800);$('pauseLoop').onclick=()=>{paused=!paused;$('pauseLoop').textContent=paused?'▶ REPRODUZIR':'Ⅱ PAUSAR'};$('stepLoop').onclick=()=>{pos=(pos+1)%4;update()};register(()=>clearInterval(timer))}
function setupCalc(){let t=0;const a=setInterval(()=>{t=Math.min(54,t+3);if($('computed'))$('computed').textContent=t;if(t===54)clearInterval(a)},65);register(()=>clearInterval(a))}
function setupFlow(){function update(){const x=Number($('skill').value),y=Number($('challenge').value),d=y-x;if(d>17){$('flowState').textContent='⚠ ANSIEDADE';$('flowState').style.color='var(--red)';$('flowDesc').textContent='Desafio acima da habilidade atual.'}else if(d< -17){$('flowState').textContent='◌ TÉDIO';$('flowState').style.color='var(--yellow)';$('flowDesc').textContent='Habilidade muito acima do desafio.'}else{$('flowState').textContent='◈ REGIÃO DE FLOW';$('flowState').style.color='var(--green)';$('flowDesc').textContent='Desafio compatível com habilidade (modelo simplificado).'}}$('skill').oninput=update;$('challenge').oninput=update;$('flowReset').onclick=()=>{$('skill').value=55;$('challenge').value=57;update()};const line=$('tensionLine');if(line&&!reduced){let length=line.getTotalLength();line.style.strokeDasharray=length;line.style.strokeDashoffset=length;requestAnimationFrame(()=>{line.style.transition='stroke-dashoffset 2.7s ease-out';line.style.strokeDashoffset=0})}update()}
function setupFocus(){let choices=[['EXPLORAÇÃO','Descobrir áreas, rotas e desafios é a principal promessa de experiência.','🧭'],['COMBATE','Padrões de ataque, domínio de armas e decisões de risco definem o ciclo.','⚔️'],['EVOLUÇÃO','Desbloquear e combinar habilidades altera constantemente as possibilidades.','⬆️'],['ESTRATÉGIA','Gerenciar recursos e tomar decisões eficientes conduz ao progresso.','♟️']];document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.focus);document.querySelectorAll('[data-focus]').forEach(x=>x.classList.toggle('active',x===b));$('focusTitle').textContent=choices[i][0];$('focusDetail').textContent=choices[i][1];$('focusIcon').textContent=choices[i][2]})}
function setupQuest(){const done=new Set();document.querySelectorAll('[data-quest]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.quest);done.has(i)?done.delete(i):done.add(i);b.classList.toggle('done',done.has(i));b.setAttribute('aria-pressed',done.has(i)?'true':'false');b.querySelector('strong').textContent=`${done.has(i)?'☑':'□'} 0${i+1}`;$('questCount').textContent=`${done.size} / 5`;$('questBar').style.width=done.size*20+'%';$('questState').textContent=done.size===5?'🏆 LEVEL UP · LOOP PLANEJADO!':'COMPLETE OS OBJETIVOS PARA SUBIR DE NÍVEL'})}
function setupAnts(){const canvas=$('antCanvas'),ctx=canvas.getContext('2d');let total=3,stock=0,cargo=1,ants=[],running=true,frame=0;const rand=(a,b)=>a+Math.random()*(b-a);function spawn(){ants.push({x:rand(140,280),y:rand(225,247),phase:0,speed:rand(.72,1.35),carry:0})}for(let i=0;i<total;i++)spawn();function ui(){if(!$('antPopulation'))return;$('antPopulation').textContent=`OPERÁRIAS: ${total}`;$('antStock').textContent=`ESTOQUE: ${stock}`;$('antCargo').textContent=`CARGA: ${cargo}`;$('antFood').textContent=String(stock).padStart(3,'0');$('antBar').style.width=`${stock%20*5}%`}$('addAnt').onclick=()=>{if(total<20){total++;spawn();ui()}};$('upgradeAnt').onclick=()=>{cargo=Math.min(cargo+1,8);ui()};$('resetAnt').onclick=()=>{total=3;stock=0;cargo=1;ants=[];for(let i=0;i<total;i++)spawn();ui()};const rect=(x,y,w,h,color)=>{ctx.fillStyle=color;ctx.fillRect(x,y,w,h)};function draw(){ctx.clearRect(0,0,720,390);rect(0,0,720,235,'#1a264b');for(let x=0;x<720;x+=54)for(let y=15;y<220;y+=49){rect(x+12,y,3,3,'#3a4d70')}rect(0,212,720,178,'#55416b');rect(0,225,720,165,'#57415a');for(let j=0;j<60;j++){let x=(j*131)%720,y=235+(j*43)%150;rect(x,y,5,3,j%2?'#7d5967':'#8f6173')}rect(55,205,135,95,'#33293f');rect(85,185,77,30,'#c79c59');rect(100,162,46,24,'#8f5b55');rect(122,240,15,55,'#1b1e35');rect(120,287,180,36,'#1b1e35');rect(272,269,60,90,'#1b1e35');rect(272,325,140,33,'#1b1e35');rect(28,198,175,5,'#a6a05e');rect(185,218,390,6,'#7fba83');for(let i=0;i<8;i++){let x=582+(i%4)*21,y=189-Math.floor(i/4)*15;rect(x,y,15,12,'#f9bc5a');rect(x+4,y-4,7,5,'#ffe08a')}rect(606,215,78,8,'#5da666');ctx.font='bold 13px monospace';ctx.fillStyle='#ffffff';ctx.fillText('NINHO / ESTOQUE',62,145);ctx.fillText('ALIMENTO',581,169);ctx.fillStyle='#27d9e8';ctx.fillText('SIMULAÇÃO EM TEMPO REAL',20,25);for(const a of ants){const dest=a.phase===0?602:150;if(!reduced||frame%12===0){a.x+=Math.sign(dest-a.x)*a.speed*1.85;if(Math.abs(dest-a.x)<4){if(a.phase===0){a.phase=1;a.carry=cargo}else{a.phase=0;stock+=a.carry;a.carry=0;ui()}}}let y=a.y+(Math.sin(frame*.13+a.x)*1.5);rect(a.x-5,y,9,6,'#232233');rect(a.x+4,y-3,8,9,'#292137');rect(a.x-10,y+2,6,5,'#392a3a');rect(a.x+8,y-5,3,3,'#f8dfbc');rect(a.x-6,y+5,2,6,'#191929');rect(a.x+5,y+5,2,6,'#191929');if(a.carry){rect(a.x-1,y-13,10,9,'#ffce59');rect(a.x+2,y-16,4,3,'#fff0a7')}}frame++;if(running)requestAnimationFrame(draw)}draw();register(()=>{running=false})}
$('prev').onclick=()=>setSlide(idx-1);$('next').onclick=()=>setSlide(idx+1);$('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('notesBtn').onclick=()=>{notesVisible=!notesVisible;$('notes').hidden=!notesVisible};$('motionBtn').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);$('motionBtn').textContent=reduced?'◯ FX OFF':'◉ FX ON'};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();setSlide(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();setSlide(idx-1)}if(e.key.toLowerCase()==='f')$('fullBtn').click();if(e.key.toLowerCase()==='n')$('notesBtn').click();if(e.key==='Home')setSlide(0);if(e.key==='End')setSlide(14)});window.addEventListener('hashchange',()=>{const n=Number(location.hash.match(/slide-(\d+)/)?.[1]);if(n>=1&&n<=15&&n!==idx+1)setSlide(n-1)});const start=Number(location.hash.match(/slide-(\d+)/)?.[1]);setSlide(start>=1&&start<=15?start-1:0);

</script></body></html>
